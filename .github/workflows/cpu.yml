name: CPU references and research artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  research:
    name: CPU replay (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [core, search, pca, pde]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pde.txt
      - run: python -m pip install -r requirements.txt -r requirements-pde.txt
      - run: python .github/ci/run_group.py "${{ matrix.group }}"
  verify:
    name: verify
    needs: research
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$REPLAY_RESULT" = success
        env:
          REPLAY_RESULT: ${{ needs.research.result }}
