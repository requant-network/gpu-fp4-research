name: CPU references and research artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q reference.py gpu_study.py verify_results.py summarize.py tests
      - run: python -m unittest discover -s tests -v
      - run: python verify_results.py
      - run: python summarize.py --check
